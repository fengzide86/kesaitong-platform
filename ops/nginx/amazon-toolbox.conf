server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.130.113.104 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://8.130.113.104$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 8.130.113.104 _;

    ssl_certificate /etc/letsencrypt/live/8.130.113.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.130.113.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ToolboxTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 320m;

    access_log /var/log/nginx/toolbox_access.log toolbox_timing;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /updates/latest.yml {
        alias /var/lib/kesaitong-platform/updates/latest.yml;
        default_type application/yaml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/updates/(?:.*/)?\. {
        return 404;
    }

    location ~ ^/updates/(?<update_artifact>[^/]+\.(?:exe|blockmap))$ {
        alias /var/lib/kesaitong-platform/updates/$update_artifact;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /updates/ {
        return 404;
    }

    location = /api/updates/releases/stage {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }

    location = /web-version.json {
        root /var/lib/kesaitong-platform/web/current;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /web-version.json =404;
    }

    location ^~ /assets/ {
        root /var/lib/kesaitong-platform/web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /var/lib/kesaitong-platform/web/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html @backend_before_first_web_release;
    }

    # Keeps the existing HTTPS root usable during the few seconds between the
    # first backend deployment and the first atomic Web activation.
    location @backend_before_first_web_release {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
