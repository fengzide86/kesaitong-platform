server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.130.113.104 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/ { return 308 https://8.130.113.104$request_uri; }
    location ^~ /updates/ { return 308 https://8.130.113.104$request_uri; }
    location = /sw.js { return 308 https://8.130.113.104/sw.js; }
    location = /api { return 404; }
    location = /updates { return 404; }
    location ^~ /assets/ { return 410; }
    location ~* \.(?:js|mjs|css|json|webmanifest|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot|wasm|zip|exe|blockmap|pdf|xlsx?|csv|txt|xml|mp4|webm|mp3|wav|ogg)$ { return 410; }
    # The explicit empty fragment prevents an old client hash from surviving.
    location / { return 302 "https://kesaitong.top/#"; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 8.130.113.104 _;

    ssl_certificate /etc/letsencrypt/live/8.130.113.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.130.113.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ToolboxTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 320m;

    access_log /var/log/nginx/toolbox_access.log toolbox_timing;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /api { return 404; }
    location = /updates { return 404; }

    location = /updates/latest.yml {
        alias /var/lib/amazon-toolbox/updates/latest.yml;
        default_type application/yaml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/updates/(?:.*/)?\. {
        return 404;
    }

    location ~ ^/updates/(?<update_artifact>[^/]+\.(?:exe|blockmap))$ {
        alias /var/lib/amazon-toolbox/updates/$update_artifact;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /updates/ {
        return 404;
    }

    location = /api/updates/releases/stage {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }

    # Kept indefinitely for already installed business-Web service workers.
    location = /sw.js {
        alias /var/lib/amazon-toolbox/web-retired/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "no-store" always;
        return 410;
    }
    location = /web-version.json { add_header Cache-Control "no-store" always; return 410; }
    location ~* \.(?:js|mjs|css|json|webmanifest|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot|wasm|zip|exe|blockmap|pdf|xlsx?|csv|txt|xml|mp4|webm|mp3|wav|ogg)$ {
        add_header Cache-Control "no-store" always;
        return 410;
    }
    location / {
        add_header Cache-Control "no-store" always;
        return 302 "https://kesaitong.top/#";
    }
}
