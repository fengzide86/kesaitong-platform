# Included from nginx.conf's http context via /etc/nginx/conf.d/*.conf.
# Deliberately omit query strings, Authorization and Cookie. Older <1.9.0
# clients can still send a one-use grant in a query; never persist that URL.
log_format toolbox_timing
  '$remote_addr - $request_id [$time_local] "$request_method $uri $server_protocol" '
  '$status $body_bytes_sent upstream=$upstream_status rt=$request_time urt=$upstream_response_time '
  'rid=$upstream_http_x_request_id ua="$http_user_agent"';

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;
