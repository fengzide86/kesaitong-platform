name: Continuous verification

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend and Electron contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run release:policy
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run architecture:check
      - run: python scripts/generate_openapi_types.py --check
      - run: npm run api-contracts:check
      - run: npm run deadcode
      - run: npm run electron:compile
      - run: npm run test:coverage
      - name: Verify marketing publication guards
        run: npm run test:marketing-publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build local renderer for isolated UI tests
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: local-renderer-dist
          path: dist/
          retention-days: 1
      - name: Build and audit the independent marketing website
        run: npm run build:marketing && npm run marketing:audit
        env:
          KST_MARKETING_SITE_URL: https://marketing.example.test
          VITE_DESKTOP_DOWNLOAD_URL: https://downloads.example.test/KST%20Setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: marketing-dist
          path: dist-marketing/
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend domains and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints-py310.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify production dependency closure in a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/toolbox-production-venv"
          "$RUNNER_TEMP/toolbox-production-venv/bin/python" -m pip install \
            -c backend/constraints-py310.txt \
            -r backend/requirements.txt
          "$RUNNER_TEMP/toolbox-production-venv/bin/python" -m pip check
          "$RUNNER_TEMP/toolbox-production-venv/bin/python" \
            scripts/check_python_constraint_closure.py
          mkdir -p "$RUNNER_TEMP/toolbox-production-runtime"
          (
            cd backend
            APP_ENV=test \
            DEBUG=true \
            TOOLBOX_RUNTIME_DIR="$RUNNER_TEMP/toolbox-production-runtime" \
            "$RUNNER_TEMP/toolbox-production-venv/bin/python" \
              -c 'import aiomysql, alembic, httpx, main, pymysql'
          )
      - name: OpenAPI snapshot and generated types
        run: >-
          python scripts/export_openapi.py --output backend/openapi.json --check &&
          python scripts/check_openapi_compat.py &&
          python scripts/generate_openapi_types.py --check
      - run: python -m pytest backend --rootdir=backend --cov=backend --cov-report=term-missing --cov-report=xml:backend/coverage.xml -q
      - name: Python diff coverage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            DIFF_BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$BEFORE_SHA"
          else
            DIFF_BASE="HEAD^"
          fi
          python scripts/check_diff_coverage.py --base "$DIFF_BASE" --threshold 80
      - run: python -m ruff check backend
      - name: Mypy application and modular monolith
        run: python -m mypy --config-file backend/pyproject.toml backend/app backend/core backend/domains backend/services backend/routers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  mariadb-concurrency:
    name: MariaDB migrations and concurrency
    runs-on: ubuntu-latest
    needs: backend
    services:
      mariadb-upgrade:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: upgrade-root-test-only
          MARIADB_DATABASE: toolbox_upgrade_test
          MARIADB_USER: toolbox_upgrade_test
          MARIADB_PASSWORD: upgrade-test-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: toolbox_test
          MARIADB_USER: toolbox_test
          MARIADB_PASSWORD: toolbox-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MARIADB_TEST_URL: mysql+aiomysql://toolbox_test:toolbox-test-only@127.0.0.1:3306/toolbox_test
      REQUIRE_MARIADB_TEST: '1'
      APP_ENV: test
      DEBUG: 'true'
      DB_TYPE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: toolbox_test
      MYSQL_USER: toolbox_test
      MYSQL_PASSWORD: toolbox-test-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints-py310.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Upgrade immutable 1.8.8 MariaDB history and verify rollback guards
        run: python scripts/verify_mariadb_upgrade.py
        env:
          MIGRATION_TEST_URL: mysql+pymysql://toolbox_upgrade_test:upgrade-test-only@127.0.0.1:3307/toolbox_upgrade_test
      - name: Upgrade an empty MariaDB database through every Alembic migration
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify MariaDB order, activation, renewal and attachment concurrency
        run: >-
          python -m pytest
          backend/tests/integration/test_mariadb_order_concurrency.py
          --rootdir=backend -q -rs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mariadb-historical-upgrade
          path: ${{ runner.temp }}/mariadb-upgrade-report.json
          if-no-files-found: error
          retention-days: 7

  responsive-e2e:
    name: Responsive C B Admin smoke
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: local-renderer-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.business.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: responsive-e2e-failure
          path: test-results/business-responsive/
          if-no-files-found: ignore
          retention-days: 7

  internal-acceptance-e2e:
    name: Internal critical-flow acceptance
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: local-renderer-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: marketing-dist
          path: dist-marketing
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.internal.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - name: Verify marketing desktop, mobile, navigation, download and real motion
        run: npx playwright test --config=playwright.marketing.config.ts
        env:
          PLAYWRIGHT_MARKETING_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: internal-acceptance-artifacts
          path: |
            test-results/internal-acceptance/
            test-results/marketing/
          if-no-files-found: ignore
          retention-days: 7

  real-control-plane-e2e:
    name: Real backend C B Admin journeys
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real
        env:
          KST_REAL_E2E_ROOT: ${{ runner.temp }}/kst-real-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-backend-acceptance
          path: |
            ${{ runner.temp }}/kst-real-e2e/**/results.json
            ${{ runner.temp }}/kst-real-e2e/**/artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  desktop-package:
    name: Windows NSIS install and runtime smoke
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Verify Windows launchers, Unicode shortcuts and immutable upgrade fixtures
        run: npx vitest run src/tests/scripts/toolboxLaunchers.test.ts src/tests/scripts/nsisUpgradeFixtures.test.ts src/tests/scripts/nsisLegacyInstallHint.test.ts src/tests/scripts/windowsShortcutReader.test.ts
      - name: Build and audit the real NSIS/update artifacts
        run: npm run desktop:verify-installer
      - name: Verify NSIS pointer copy at protected memory boundaries
        shell: pwsh
        run: |
          node scripts/test-nsis-known-folder-copy.mjs
          $probeExit = $LASTEXITCODE
          New-Item -ItemType Directory -Path test-results/nsis-memory -Force | Out-Null
          Get-ChildItem -LiteralPath 'D:\AmazonToolboxData\installer-smoke' -Directory -Filter 'kst-nsis-memory-probe-*' | ForEach-Object {
            $probeReport = Join-Path $_.FullName 'result.json'
            if (Test-Path -LiteralPath $probeReport) {
              Copy-Item -LiteralPath $probeReport -Destination (Join-Path 'test-results/nsis-memory' ($_.Name + '.json'))
            }
          }
          if ($probeExit -ne 0) { throw 'NSIS memory boundary probe failed' }
      - name: Verify app protocol renderer boot
        run: npm run test:app-protocol
      - name: Verify packaged automation runner protocol
        run: npm run test:automation-smoke -- --mock
      - name: Verify clean candidate install, packaged runtime and uninstall
        shell: pwsh
        run: ./scripts/nsis-install-smoke.ps1 -PreviousInstaller '' -DiagnosticAttempts 1
      - name: Restore immutable legacy installers (always recheck SHA512)
        id: historical-installers
        uses: actions/cache/restore@v5
        with:
          path: |
            D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.5.exe
            D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.7.exe
          key: windows-nsis-baselines-${{ hashFiles('scripts/nsis-upgrade-fixture-1.8.7.json', 'scripts/nsis-upgrade-fixture.json') }}
      - name: Restore immutable 1.8.8 installer (always recheck SHA512)
        id: current-production-installer
        uses: actions/cache/restore@v5
        with:
          path: D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.8.exe
          key: windows-nsis-baseline-1.8.8-${{ hashFiles('scripts/nsis-upgrade-fixture-1.8.8.json') }}
      - name: Fetch immutable 1.8.5 release for upgrade acceptance
        run: node scripts/prepare-nsis-upgrade.mjs
        env:
          NSIS_BASELINE_VERSION: '1.8.5'
      - name: Fetch immutable 1.8.7 release for upgrade acceptance
        run: node scripts/prepare-nsis-upgrade.mjs
        env:
          NSIS_BASELINE_VERSION: '1.8.7'
      - name: Fetch immutable 1.8.8 release for current-production upgrade acceptance
        run: node scripts/prepare-nsis-upgrade.mjs
        env:
          NSIS_BASELINE_VERSION: '1.8.8'
      - name: Save only byte-verified legacy installer fixtures
        if: steps.historical-installers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.5.exe
            D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.7.exe
          key: windows-nsis-baselines-${{ hashFiles('scripts/nsis-upgrade-fixture-1.8.7.json', 'scripts/nsis-upgrade-fixture.json') }}
      - name: Save only byte-verified 1.8.8 installer fixture
        if: steps.current-production-installer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: D:/AmazonToolboxData/installer-fixtures/KST Setup 1.8.8.exe
          key: windows-nsis-baseline-1.8.8-${{ hashFiles('scripts/nsis-upgrade-fixture-1.8.8.json') }}
      - name: Verify existing-location 1.8.5 baseline and real upgrade, runtime and uninstall
        shell: pwsh
        run: ./scripts/nsis-install-smoke.ps1 -PreviousVersion '1.8.5' -PreviousInstaller 'D:\AmazonToolboxData\installer-fixtures\KST Setup 1.8.5.exe' -LegacyInstallLocationHint -DiagnosticAttempts 1
      - name: Verify existing-location 1.8.7 baseline and real upgrade, runtime and uninstall
        shell: pwsh
        run: ./scripts/nsis-install-smoke.ps1 -PreviousVersion '1.8.7' -PreviousInstaller 'D:\AmazonToolboxData\installer-fixtures\KST Setup 1.8.7.exe' -LegacyInstallLocationHint -DiagnosticAttempts 1
      - name: Verify original 1.8.8 clean install and real upgrade, runtime and uninstall
        shell: pwsh
        run: ./scripts/nsis-install-smoke.ps1 -PreviousVersion '1.8.8' -PreviousInstaller 'D:\AmazonToolboxData\installer-fixtures\KST Setup 1.8.8.exe' -DiagnosticAttempts 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-nsis-and-update-artifacts
          path: |
            release/KST Setup *.exe
            release/KST Setup *.exe.blockmap
            release/latest.yml
            test-results/nsis/**
            test-results/nsis-memory/**
          retention-days: 3
